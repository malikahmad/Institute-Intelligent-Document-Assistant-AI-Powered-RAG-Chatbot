{% extends "base.html" %}{% block title %}Register | Institute AI{% endblock %}{% block content %}
<section class="auth"><form class="card" method="post" action="{{ url_for('auth.register') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="logo">IA</div><h1>Create your account</h1><p class="muted">Student registration</p>
<label>Full name</label><input name="name" maxlength="120" required autocomplete="name"><label>Email address</label><input type="email" name="email" required autocomplete="email">
<label>Password (at least 8 characters)</label><input type="password" name="password" minlength="8" required autocomplete="new-password">
<label>Confirm password</label><input type="password" name="confirm_password" minlength="8" required autocomplete="new-password">
<button class="btn primary full" type="submit">Create account</button><p class="center">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></form></section>{% endblock %}
