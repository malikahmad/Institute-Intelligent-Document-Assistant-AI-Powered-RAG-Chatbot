{% extends "base.html" %}{% block title %}Sign in | Institute AI{% endblock %}{% block content %}
<section class="auth"><form class="card" method="post" action="{{ url_for('auth.login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="logo">IA</div><h1>Welcome back</h1><p class="muted">Sign in to your institute assistant</p>
<label>Email</label><input type="email" name="email" required autocomplete="email"><label>Password</label><input type="password" name="password" required autocomplete="current-password">
<button class="btn primary full">Sign in</button><p class="center">New student? <a href="{{ url_for('auth.register') }}">Create an account</a></p></form></section>{% endblock %}
